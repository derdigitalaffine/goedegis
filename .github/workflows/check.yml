name: Static checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r services/control/requirements.txt
      - name: Python syntax
        run: python -m compileall -q services/control/app scripts/deploy.py
      - name: Backend tests
        env:
          PYTHONPATH: services/control
        run: python -m unittest discover -s services/control/app/tests -v
      - name: Compose config
        run: |
          cp .env.example .env
          docker compose --profile core --profile database --profile jobs --profile tiles --profile geocoding --profile routing --profile ogc --profile monitoring config -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend install and build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright UI checks
        working-directory: web
        run: npm run test:e2e
