<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goedegis · LAN GIS</title><meta name="theme-color" content="#101e30"></head><body><header><h1>◈ GOEDEGIS</h1><span id="status">LAN GIS</span></header><div class="shell"><aside>
<section class="panel stack"><h2>Suche & Navigation</h2><form id="search-form" class="stack"><input id="search" placeholder="Adresse oder Ort" aria-label="Ort"><button>Suchen</button></form><div id="results"></div><div class="row"><input id="from" placeholder="Start lon,lat" aria-label="Start"><input id="to" placeholder="Ziel lon,lat" aria-label="Ziel"></div><select id="profile"><option value="auto">Auto</option><option value="bicycle">Fahrrad</option><option value="pedestrian">Zu Fuß</option><option value="truck">Lkw</option></select><button id="route">Route berechnen</button><button class="secondary" id="tile-style">Lokale Basiskarte laden</button></section>
<section class="panel stack"><h2>Kartengebiete</h2><input id="area-name" placeholder="Gebietsname"><div class="row"><label>Zoom min<input id="zmin" type="number" value="0" min="0" max="22"></label><label>Zoom max<input id="zmax" type="number" value="14" min="0" max="22"></label></div><input id="area-layers" placeholder="Layer-IDs (Komma getrennt)" aria-label="Layer für dieses Gebiet"><input id="area-tags" placeholder="OSM-Tags, z.B. highway,amenity" aria-label="OSM-Tags"><div class="row"><button id="draw">Polygon zeichnen</button><button id="save">Gebiet speichern</button><button id="clear" class="secondary">Zurücksetzen</button></div><div id="areas"></div></section>
<section class="panel stack"><h2>OGC-Quellen</h2><form id="source-form" class="stack"><input id="source-name" placeholder="Quellenname" required><input id="source-url" type="url" placeholder="https://.../wms" required><input id="source-layer" placeholder="Layer"><select id="source-kind"><option value="wms">WMS</option><option value="wmts">WMTS</option><option value="wfs">WFS</option><option value="osm">OSM</option><option value="xyz">XYZ-Raster</option></select><button>Quelle speichern</button></form><label class="row"><input id="source-cache" type="checkbox" style="width:auto;flex:0"> Caching durch Datenanbieter erlaubt</label><div id="sources"></div></section>
<section class="panel stack"><h2>Offline-Cache & Layer</h2><small>Gebiet und ausdrücklich freigegebene Rasterquelle auswählen. Das Prewarming kann erhebliche Datenmengen erzeugen.</small><select id="cache-area" aria-label="Cache-Gebiet"></select><select id="cache-source" aria-label="Cache-Quelle"></select><label>Maximale Kacheln<input id="cache-limit" type="number" min="1" max="30000" value="1000"></label><button id="cache-start">Cache vorwärmen</button><label class="row"><input type="checkbox" id="layer-visible" style="width:auto;flex:0" checked> Offline-Layer anzeigen</label><label>Layer-Deckkraft<input id="layer-opacity" type="range" min="0" max="100" value="85"></label><label>Hintergrundfarbe<input id="background-color" type="color" value="#e4e9ed"></label><button id="apply-style">Kartenstil anwenden</button></section><section class="panel stack"><h2>Jobs & Ressourcen</h2><div id="resources" class="muted">Laden…</div><select id="job-type"><option value="download_osm">OSM-PBF herunterladen</option><option value="wfs_sync">WFS nach PostGIS</option><option value="tile_prewarm">Tile-Prewarming (noch nicht implementiert)</option></select><input id="job-url" type="url" placeholder="HTTPS-Quelle"><input id="job-table" placeholder="WFS-Zieltabelle" value="wfs_import"><label>Priorität<input id="priority" type="number" value="0" min="-100" max="100"></label><div class="row"><button id="queue">Job einreihen</button><button id="refresh" class="secondary">Aktualisieren</button></div><div id="jobs"></div></section>
</aside><div class="map-wrap"><div id="map"></div><div class="map-hint">Lokale Kartenkacheln nach Konfiguration verfügbar</div></div></div><script type="module" src="/src/main.js"></script></body></html>
