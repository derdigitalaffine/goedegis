events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 80;
    client_max_body_size 20m;
    location / { set $target http://web:80; proxy_pass $target; proxy_set_header Host $host; }
    location /control/ { set $target http://control:8000; proxy_pass $target; proxy_set_header Host $host; }
    location /tiles/ { set $target http://tiles:3000; rewrite ^/tiles/(.*)$ /$1 break; proxy_pass $target; proxy_set_header Host $host; }
    location /nominatim/ { set $target http://nominatim:8080; rewrite ^/nominatim/(.*)$ /$1 break; proxy_pass $target; }
    location /routing/ { set $target http://valhalla:8002; rewrite ^/routing/(.*)$ /$1 break; proxy_pass $target; }
    location /mapproxy/ { set $target http://mapproxy:8080; rewrite ^/mapproxy/(.*)$ /$1 break; proxy_pass $target; }
    location /geoserver/ { set $target http://geoserver:8080; proxy_pass $target; }
  }
}